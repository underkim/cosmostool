name: Build Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'claude/**'

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install common build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-l10n-tools libgl1-mesa-dev libssl-dev \
            libspdlog-dev nlohmann-json3-dev libssh2-1-dev

      - name: Auto-detect and build
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

          if [ -f CMakeLists.txt ]; then
            echo "Detected CMake project"
            # spdlog/nlohmann_json/libssh2 are installed above, so
            # cmake/Dependencies.cmake's find_package() checks pick them up
            # directly instead of building them from source via FetchContent.
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
            cmake --build build --config Release --parallel
          elif [ -f Makefile ] || [ -f makefile ]; then
            echo "Detected Makefile project"
            make -j"$(nproc)"
          elif [ -f go.mod ]; then
            echo "Detected Go project"
            mkdir -p build
            go build -o build/app ./...
          elif [ -f Cargo.toml ]; then
            echo "Detected Rust project"
            cargo build --release
          elif [ -f package.json ]; then
            echo "Detected Node.js project"
            npm ci
            npm run build --if-present
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "Detected Python project"
            python3 -m pip install --upgrade pip pyinstaller
            if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi

            entry=""
            for candidate in main.py app.py src/main.py; do
              if [ -f "$candidate" ]; then
                entry="$candidate"
                break
              fi
            done

            if [ -z "$entry" ]; then
              echo "No Python entry file found. Expected one of: main.py, app.py, src/main.py"
              exit 1
            fi

            pyinstaller --onefile "$entry" --name app
          else
            echo "No supported build file found."
            echo "Add one of: CMakeLists.txt, Makefile, go.mod, Cargo.toml, package.json, pyproject.toml, requirements.txt"
            exit 1
          fi

      - name: Collect Linux executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux
          find . \
            -type f \
            -not -path './.git/*' \
            -not -path './artifacts/*' \
            -not -path './node_modules/*' \
            -not -path './.venv/*' \
            -perm -111 \
            -exec cp --parents '{}' artifacts/linux/ \;

      - name: Upload Linux executable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: executable-linux
          path: artifacts/linux
          if-no-files-found: error

  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt6
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.7.2'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Enable MSVC developer environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found at $vswhere"
          }

          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1
          if (-not $installPath) {
            throw "A Visual Studio installation with the C++ toolchain was not found"
          }

          $devCmd = Join-Path $installPath "Common7\Tools\VsDevCmd.bat"
          $captured = @{}
          & $env:ComSpec /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                $captured[$Matches[1]] = $Matches[2]
              }
            }
          if ($LASTEXITCODE -ne 0) {
            throw "VsDevCmd.bat failed with exit code $LASTEXITCODE"
          }

          $required = @("PATH", "INCLUDE", "LIB", "LIBPATH", "VCToolsInstallDir")
          $optional = @(
            "VCINSTALLDIR", "VCToolsRedistDir", "VSINSTALLDIR",
            "UniversalCRTSdkDir", "UCRTVersion", "WindowsSdkDir",
            "WindowsSdkBinPath", "WindowsSdkVerBinPath", "WindowsSDKVersion"
          )
          foreach ($name in $required) {
            if (-not $captured.ContainsKey($name)) {
              throw "VsDevCmd.bat did not define required environment variable $name"
            }
            "$name=$($captured[$name])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          foreach ($name in $optional) {
            if ($captured.ContainsKey($name)) {
              "$name=$($captured[$name])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      # No system spdlog/nlohmann_json/libssh2 packages are installed on this
      # runner, so cmake/Dependencies.cmake falls back to building all three
      # from source via FetchContent on every run - the bulk of this job's
      # time. Cache that output (keyed on the file that pins their versions)
      # so unrelated app-source-only changes reuse it instead of rebuilding
      # spdlog/libssh2 from scratch each time.
      # Key includes the generator: a cache entry's key is immutable once
      # created, so switching the build below from the implicit MSBuild
      # solution generator to Ninja needs a new key - reusing the old one
      # would keep restoring MSBuild-format build output that Ninja can't
      # use, and (since that key already exists) never get overwritten with
      # a Ninja-compatible one.
      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: ${{ runner.os }}-ninja-fetchcontent-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Auto-detect and build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Repository files:"
          Get-ChildItem -Recurse -File | Select-Object -ExpandProperty FullName

          if (Test-Path "CMakeLists.txt") {
            Write-Host "Detected CMake project"
            # CMakePresets.json already builds this project with Ninja+cl.exe
            # on Windows (see the "base"/"debug"/"release" presets) - this step
            # was the odd one out, using raw cmake with no -G and therefore
            # falling back to the default Visual Studio/MSBuild solution
            # generator. That generator only parallelizes at the *project*
            # level (--parallel//m), which this codebase's strictly layered
            # target graph (app -> ui -> viewmodels -> services -> core) barely
            # exercises. Ninja schedules every compile edge across the *whole*
            # dependency graph, so independent files within one target (e.g.
            # opencosmos_ui's 30+ source files) parallelize too, matching how
            # the Linux job already builds this project.
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
            cmake --build build --parallel
          } elseif (Test-Path "go.mod") {
            Write-Host "Detected Go project"
            New-Item -ItemType Directory -Force -Path build | Out-Null
            go build -o build/app.exe ./...
          } elseif (Test-Path "Cargo.toml") {
            Write-Host "Detected Rust project"
            cargo build --release
          } elseif (Test-Path "package.json") {
            Write-Host "Detected Node.js project"
            npm ci
            npm run build --if-present
          } elseif ((Test-Path "pyproject.toml") -or (Test-Path "requirements.txt")) {
            Write-Host "Detected Python project"
            python -m pip install --upgrade pip pyinstaller
            if (Test-Path "requirements.txt") {
              python -m pip install -r requirements.txt
            }

            $entry = @("main.py", "app.py", "src/main.py") |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

            if (-not $entry) {
              throw "No Python entry file found. Expected one of: main.py, app.py, src/main.py"
            }

            pyinstaller --onefile $entry --name app
          } else {
            throw "No supported build file found. Add one of: CMakeLists.txt, Makefile, go.mod, Cargo.toml, package.json, pyproject.toml, requirements.txt"
          }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Make Windows portable package and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcVarsAll = Join-Path $env:VCINSTALLDIR "Auxiliary\Build\vcvarsall.bat"
          & ./packaging/package.ps1 -SkipBuild -BuildDir build `
            -QtPath $env:QT_ROOT_DIR -VcVarsAll $vcVarsAll

      - name: Upload Windows portable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenC3DevToolkit-portable-windows
          path: OpenC3DevToolkit-portable-windows.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenC3DevToolkit-windows-installer
          path: OpenC3DevToolkit-0.1.0-Setup.exe
          if-no-files-found: error

      - name: Upload Windows package checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenC3DevToolkit-windows-checksums
          path: OpenC3DevToolkit-0.1.0-SHA256SUMS.txt
          if-no-files-found: error

      - name: Collect Windows executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts/windows | Out-Null

          $exeFiles = Get-ChildItem -Recurse -File -Include *.exe |
            Where-Object {
              $_.FullName -notmatch '\\.git\\|\\artifacts\\|\\node_modules\\|\\.venv\\'
            }

          foreach ($file in $exeFiles) {
            $relative = Resolve-Path -Relative $file.FullName
            $target = Join-Path "artifacts/windows" $relative
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            Copy-Item $file.FullName $target -Force
          }

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: executable-windows
          path: artifacts/windows
          if-no-files-found: error
